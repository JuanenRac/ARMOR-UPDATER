[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-updater"
version = "0.0.1"
description = "Detects, installs, and manually updates the A.R.M.O.R. ecosystem's projects on the machine it runs on (the central server, or a dev machine with the same checkout layout). Every A.R.M.O.R. repository is private: a GITHUB_TOKEN is required for remote discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["armor", "updater", "installer", "fleet-management"]
# The CLI and its safety-critical update core remain stdlib-only. The visual
# desktop shell is optional because a headless deployment must not need a
# Qt runtime.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["PySide6>=6.8,<7"]

[project.urls]
Homepage = "https://github.com/JuanenRac/ARMOR-UPDATER"

[project.scripts]
armor-updater = "armor_updater.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
armor_updater = ["qml/*.qml"]
