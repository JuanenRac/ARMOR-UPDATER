[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-updater"
version = "0.1.6"
description = "Detects, installs, and manually updates the A.R.M.O.R. ecosystem's projects on the machine it runs on (the central server, or a dev machine with the same checkout layout). Every A.R.M.O.R. repository is public: remote discovery works with no GITHUB_TOKEN, an optional one just raises the request ceiling."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["armor", "updater", "installer", "fleet-management"]
# The CLI and its safety-critical update core remain stdlib-only. The visual
# desktop shell is optional because a headless deployment must not need a
# Qt runtime.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy==2.4.0"]
gui = ["PySide6>=6.8,<7"]

[project.urls]
Homepage = "https://github.com/JuanenRac/ARMOR-UPDATER"

[project.scripts]
armor-updater = "armor_updater.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
armor_updater = ["qml/*.qml", "assets/*", "data/allowed_signers"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
# Real mistakes only (unused names, undefined names, syntax errors, bugbear); no style rules.
select = ["F", "E9", "B"]
ignore = ["B008", "B904"]

[tool.mypy]
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
# Qt declares a property's type as a string ("QVariantList", "QStringList") and its stubs expect a class; the bridge's own properties read as plain values inside it.
module = ["armor_updater.qt_gui"]
disable_error_code = ["arg-type", "operator"]
